name: Bug report
description: Report a defect in ParkTwin AI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.
        For security vulnerabilities, follow SECURITY.md instead of this template.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I run process-frame with image X, the server returns 500...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Start the backend with `uvicorn backend.app.app:app`
        2. POST /integration/process-frame with ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: ParkTwin AI version (see `GET /health` or `pyproject.toml`)
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend (API / modules)
        - Frontend (apps/web)
        - Engine / pipeline (M1)
        - Parking intelligence (M2)
        - Integration layer (M3)
        - Analytics (M4)
        - Reporting (M5)
        - Docs / repo
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Paste logs (from `logs/parktwin.log`) or response bodies. Redact PII.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and docs first.
          required: true
        - label: I ran the test/build gates and they pass (or the bug is that they fail).
          required: false
