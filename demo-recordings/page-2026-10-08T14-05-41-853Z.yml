        - generic [ref=e2488]: "SYNERGY 2026: SYNERGY 2026 is an 8-Hour Hardware Simulation Hackathon organized by the Students' Council and Institution's Innovation Council (IIC) at Fr. Conceicao Rodrigues College of Engineering (Fr. CRCE), Bandra, Mumbai. The event brings together engineers, tinkerers, and creators to redefine sustainable product design through advanced hardware simulations. Participants will build eco-conscious, virtual prototypes without generating physical hardware waste. Tracks & Focus Areas: Electronics Domain: Design sustainable hardware solutions using virtual simulation tools such as Tinkercad, Proteus, ModelSim, or Vivado. Systems should be built around Arduino, ESP32, Raspberry Pi, or FPGA platforms, focusing on energy efficiency, minimal material use, and renewable logic. Mechanical Domain: Advance sustainable mechanical design by building CAD models and conducting simulations. Validate and optimize eco-friendly solutions using Multibody Dynamics, Motion Analysis, Finite Element Analysis (FEA), or Computational Fluid Dynamics (CFD). Eligibility Criteria: Open to undergraduate students pursuing B.E./B.Tech, Technical Diploma, or any other UG degree. Team Size: 2 to 4 members per team. Selection & Event Timeline (1st November 2026): Screening & Allotment: Domain and problem statement lists will be provided 1 day prior to the event following registration and screening. Pre-selection: Teams can choose their preferred problem statement on October 31st (12 hours prior to the event). 08:00 AM: Reporting Time and Registrations. 09:00 AM: Hackathon Commences. 01:00 PM: Lunch Break. 02:00 PM: Judging Round 1 (Panel A). 05:00 PM: Judging Round 2 (Panel B). 07:30 PM - 08:00 PM: Results & Closing Ceremony. Evaluation & Format: Two-Tier Independent Evaluation: Every team is evaluated by two separate judging panels to ensure an unbiased assessment. Round 1 is judged by Panel A, and Round 2 is independently judged by Panel B without influence from earlier scores. Aggregate Scoring: The combined score across both rounds determines final standings. Awards: Each track (Electronics and Mechanical) will have one Winner and one Runner-Up. There are no separate winners for individual problem statements. Registration Fee: Rs. 300 per team. Note: Payment is required ONLY after selection for the final offline round. Rules & Code Of Conduct: Internet access is provided at the venue; participants may refer to online resources. Mandatory carrying and displaying of official College Photo ID cards at all times on campus. Attendance is mandatory on campus for the entire 8-hour duration. Entry security screening and frisking will take place at the campus entrance. Decisions made by the judges and managing committee are final and binding. Prizes: Total Cash Prize Pool: Rs. 40,000 + Goodies."
