# ============================================================
# ParkTwin AI — Camera-to-Floor Calibration
# ============================================================
# Maps camera image plane (normalized [0, 1] or pixel coordinates)
# to facility floor coordinates in meters.
#
# Status:
#   calibrated   : Verified homography matrix computed from surveyed reference points.
#   unconfigured : No surveyed ground truth reference points available.
#                  NO coordinates will be guessed or fabricated.
# ============================================================

facility_id: "Carparking-01"
floor_level: "B2"
coordinate_units: "meters"

cameras:
  CAM-01:
    name: "B2 Entrance Gate"
    status: "unconfigured"
    image_resolution: [1920, 1080]
    # Synthetic homography matrix preserved strictly for unit tests. NEVER used at runtime.
    _synthetic_test_only:
      homography_matrix:
        - [0.0352, -0.0124, 52.10]
        - [0.0041, 0.0485, 1.85]
        - [-0.00002, 0.00015, 1.0]
      ground_reference_points:
        image_points:
          - [320, 950]
          - [1600, 950]
          - [1400, 480]
          - [520, 480]
        floor_points_meters:
